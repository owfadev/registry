# vault-wiki package index — what `kernel install/list-remote` resolve against (issue #20)
# trust: framework-bundled (built & reviewed in-org via the normal PR flow) / reviewed-3rd-party (an index PR is the human-review gate)
# members: slash-separated — install verifies index row ↔ PKG.yaml roster consistency
# provides: optional, comma-separated capability ids the package's transports contract serves (e.g. qq.transport) — cross-package discovery; the kernel does not match on it mechanically yet (work order #56)
# harness: optional, absent = universal (any harness can use it); a harness-locked package declares its id honestly (e.g. openclaw) and health checks surface the mismatch
packages:
  cuhksz: {repo: https://github.com/owfadev/owfa-cuhksz, version: 0.2, compat: ">= 0.2", trust: framework-bundled, members: cuhksz/bb/bb-map/bb-track/bb-teach/bb-quiz/sis/registry, summary: CUHK-SZ school domain — bb course ops · sis records · registry}
  lark:   {repo: https://github.com/owfadev/owfa-lark,   version: 0.2, compat: ">= 0.2", trust: framework-bundled, members: lark/lark-docs/lark-im/lark-calendar, summary: Feishu/Lark domain — docs · im · calendar}
  email:  {repo: https://github.com/owfadev/owfa-email,  version: 0.2, compat: ">= 0.2", trust: framework-bundled, members: email, summary: personal mailbox domain — mail-cli}
  bili:   {repo: https://github.com/owfadev/owfa-bili,   version: 0.3, compat: ">= 0.2", trust: framework-bundled, members: bili/bili-pet, summary: bilibili content domain — bili-cli · optional raised-risk member bili-pet (autonomous agent, standing consent)}
  project:{repo: https://github.com/owfadev/owfa-project, version: 0.2, compat: ">= 0.2", trust: framework-bundled, members: project, summary: project container domain}
  github: {repo: https://github.com/owfadev/owfa-github, version: 0.2, compat: ">= 0.3", trust: framework-bundled, members: github, summary: GitHub state cache domain with system gh connector and offline reads}
  diary:  {repo: https://github.com/owfadev/owfa-diary,  version: 0.3, compat: ">= 0.2", trust: framework-bundled, members: diary, summary: personal diary zone — vault-backed daily entries, wiki-mapped corpus (human writing; privacy at use; optional package)}
  qq:     {repo: https://github.com/owfadev/owfa-qq,     version: 0.3.0, compat: ">= 0.3", trust: framework-bundled, members: qq, summary: Official QQ Bot domain — qq-cli WebSocket intake · passive replies · whitelist human-only (official QQ platform; disclosure-only)}
  personal: {repo: https://github.com/owfadev/owfa-personal, version: 0.1.0, compat: ">= 0.4", trust: framework-bundled, commit: 58626400dbaaa9b5c35910da118fe80f4c672cac, provides: owfa.org.v1, members: calendar/cron/device/domain/hot/index/instance-git/language/link/log/mapping/notes/sessions/structure/tag/tmp/todo/trust/user-profile/vault/wiki, summary: OWFA personal suite — the default information-organization package (21 plugins; kind suite; init default; purely local · no credentials)}
