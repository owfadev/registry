# vault-wiki package index — what `kernel install/list-remote` resolve against (issue #20)
# trust: framework-bundled (built & reviewed in-org via the normal PR flow) / reviewed-3rd-party (an index PR is the human-review gate)
# members: slash-separated — install verifies index row ↔ PKG.yaml roster consistency
packages:
  cuhksz: {repo: https://github.com/AIE3905-Wuwa/pkg-cuhksz, version: 0.2, compat: ">= 0.2", trust: framework-bundled, members: cuhksz/bb/bb-map/bb-track/bb-teach/bb-quiz/sis/registry, summary: CUHK-SZ school domain — bb course ops · sis records · registry}
  lark:   {repo: https://github.com/AIE3905-Wuwa/pkg-lark,   version: 0.2, compat: ">= 0.2", trust: framework-bundled, members: lark/lark-docs/lark-im/lark-calendar, summary: Feishu/Lark domain — docs · im · calendar}
  email:  {repo: https://github.com/AIE3905-Wuwa/pkg-email,  version: 0.2, compat: ">= 0.2", trust: framework-bundled, members: email, summary: personal mailbox domain — mail-cli}
  bili:   {repo: https://github.com/AIE3905-Wuwa/pkg-bili,   version: 0.2, compat: ">= 0.2", trust: framework-bundled, members: bili, summary: bilibili content domain — bili-cli}
  project:{repo: https://github.com/AIE3905-Wuwa/pkg-project, version: 0.2, compat: ">= 0.2", trust: framework-bundled, members: project, summary: project container domain}
  github: {repo: https://github.com/AIE3905-Wuwa/pkg-github, version: 0.2, compat: ">= 0.3", trust: framework-bundled, members: github, summary: GitHub state cache domain with system gh connector and offline reads}
  diary:  {repo: https://github.com/AIE3905-Wuwa/pkg-diary,  version: 0.2, compat: ">= 0.2", trust: framework-bundled, members: diary, summary: personal diary zone — vault-backed daily entries, agent-managed (verbatim default; delegated compose/polish/edit; optional package)}
